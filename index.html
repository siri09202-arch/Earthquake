<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地震情報テキストジェネレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .shindo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
            font-size: 0.85rem;
        }
        /* 震度ごとのカラー設定 */
        .shindo-1 { background-color: #9ca3af; }
        .shindo-2 { background-color: #60a5fa; }
        .shindo-3 { background-color: #fbd38d; color: #744210; }
        .shindo-4 { background-color: #f6ad55; }
        .shindo-5- { background-color: #ed8936; }
        .shindo-5-plus { background-color: #dd6b20; }
        .shindo-6- { background-color: #e53e3e; }
        .shindo-6-plus { background-color: #c53030; }
        .shindo-7 { background-color: #742a2a; }
        .shindo-46 { background-color: #dd6b20; } /* 未入電(5弱以上推定) */
        
        .list-item-active {
            background-color: #e0f2fe;
            border-left: 4px solid #3b82f6;
        }
        
        /* Toast animation */
        @keyframes slideInUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 9999px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 50;
            display: none;
            font-weight: bold;
        }
        .toast.show {
            display: block;
            animation: slideInUp 0.3s ease-out forwards;
        }
        .toast.hide {
            display: block;
            animation: fadeOut 0.3s ease-in forwards;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="bg-blue-600 text-white p-4 shadow-md z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-earth-asia"></i>
            地震情報テキストジェネレーター
        </h1>
        <button onclick="fetchEarthquakeData()" class="bg-blue-700 hover:bg-blue-800 p-2 rounded-full transition-colors text-sm px-4 flex items-center gap-2">
            <i class="fa-solid fa-rotate-right"></i> 更新
        </button>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- 左側：履歴リスト -->
        <div class="w-full md:w-1/3 border-r border-gray-200 bg-white flex flex-col h-1/3 md:h-full">
            <div class="p-3 bg-gray-50 border-b border-gray-200 font-bold text-gray-700 text-sm">
                最新の地震履歴 (詳細情報のみ)
            </div>
            <div id="earthquake-list" class="flex-1 overflow-y-auto">
                <div class="p-8 text-center text-gray-400">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>
                    データを取得中...<br>
                    <span id="fetch-progress" class="text-xs"></span>
                </div>
            </div>
        </div>

        <!-- 右側：プレビュー＆コピー領域 -->
        <div class="w-full md:w-2/3 flex flex-col h-2/3 md:h-full bg-gray-50 relative">
            
            <div class="p-4 bg-white border-b border-gray-200 flex flex-wrap justify-between items-center shadow-sm z-10 gap-3">
                <div class="flex flex-col gap-2 w-full md:w-auto">
                    <div class="flex items-center gap-2">
                        <h2 class="font-bold text-gray-700 hidden md:block">生成テキスト</h2>
                        <select id="format-select" onchange="updateText()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold text-gray-700 cursor-pointer hover:bg-gray-100 transition-colors">
                            <optgroup label="標準・SNS">
                                <option value="standard">標準フォーマット</option>
                                <option value="discord" selected>Discord用</option>
                                <option value="twitter">X (Twitter)用</option>
                                <option value="line">LINE用</option>
                                <option value="insta">Instagram用</option>
                                <option value="youtube">YouTube用</option>
                            </optgroup>
                            <optgroup label="ニュース・公式風">
                                <option value="nhk">NHKニュース風</option>
                                <option value="yahoo_weather">Yahoo!天気・災害風</option>
                                <option value="jma">気象庁風</option>
                                <option value="weathernews">ウェザーニュース風</option>
                                <option value="tenkijp">tenki.jp風</option>
                            </optgroup>
                            <optgroup label="防災アプリ・Bot風">
                                <option value="j_risq">J-RISQ風</option>
                                <option value="yahoo_bousai">Yahoo!防災速報風</option>
                                <option value="p2p">P2P地震情報風</option>
                                <option value="nerv">特務機関NERV風</option>
                                <option value="jquake">JQuake風</option>
                                <option value="eqmonitor">EQMonitor風</option>
                                <option value="earthquickly">EarthQuickly風</option>
                                <option value="dpibot">DPI-Bot風</option>
                            </optgroup>
                            <optgroup label="その他">
                                <option value="simple">簡易フォーマット</option>
                                <option value="detail">詳細フォーマット</option>
                            </optgroup>
                        </select>
                    </div>
                    <!-- 観測点トグルチェックボックス -->
                    <label class="flex items-center gap-2 text-xs md:text-sm font-medium text-gray-600 cursor-pointer bg-white px-2 py-1 rounded border border-gray-200 hover:bg-gray-50 w-max">
                        <input type="checkbox" id="raw-points-check" onchange="updateText()" class="rounded text-blue-600 focus:ring-blue-500 w-4 h-4">
                        観測点（詳細な地点情報）で出力する
                    </label>
                </div>
                <button id="copy-btn" onclick="copyToClipboard()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold shadow transition-colors flex items-center gap-2 disabled:bg-gray-400 disabled:cursor-not-allowed" disabled>
                    <i class="fa-regular fa-copy"></i>
                    コピーする
                </button>
            </div>

            <div class="flex-1 p-4 md:p-6 overflow-hidden">
                <textarea id="output-text" class="w-full h-full p-4 border border-gray-300 rounded-xl shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none font-mono text-sm md:text-base leading-relaxed bg-white" readonly placeholder="左側のリストから地震を選択してください..."></textarea>
            </div>
        </div>

    </main>

    <!-- トースト通知 -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-check-circle mr-2"></i> コピーしました！
    </div>

    <script>
        // P2P地震情報APIのスケール（震度）マッピング
        const scaleMap = {
            10: { label: '1', class: 'shindo-1' },
            20: { label: '2', class: 'shindo-2' },
            30: { label: '3', class: 'shindo-3' },
            40: { label: '4', class: 'shindo-4' },
            45: { label: '5弱', class: 'shindo-5-' },
            46: { label: '5弱推定', class: 'shindo-46' }, // 震度5弱以上と推定（未入電）
            50: { label: '5強', class: 'shindo-5-plus' },
            55: { label: '6弱', class: 'shindo-6-' },
            60: { label: '6強', class: 'shindo-6-plus' },
            70: { label: '7', class: 'shindo-7' }
        };

        // 津波メッセージのマッピング
        const tsunamiMap = {
            "None": "この地震による津波の心配はありません。",
            "Unknown": "津波の影響は現在不明です。",
            "Checking": "津波の影響は現在調査中です。",
            "NonDestructive": "若干の海面変動が予想されますが、被害の心配はありません。",
            "Warning": "津波警報等（大津波警報・津波警報・津波注意報）が発表されています。"
        };

        let currentEarthquakes = [];
        let currentSelectedEqIndex = -1;

        // P2P地震情報APIからデータを取得
        async function fetchEarthquakeData() {
            const listContainer = document.getElementById('earthquake-list');
            listContainer.innerHTML = `
                <div class="p-8 text-center text-gray-400">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>
                    データを取得中...<br>
                    <span id="fetch-progress" class="text-xs"></span>
                </div>
            `;
            document.getElementById('output-text').value = '';
            document.getElementById('copy-btn').disabled = true;

            try {
                let allData = [];
                // 1000件程度取得するために、100件ずつ10回リクエストを行う
                for (let i = 0; i < 10; i++) {
                    const offset = i * 100;
                    const progressEl = document.getElementById('fetch-progress');
                    if (progressEl) progressEl.innerText = `${offset}件〜 取得中`;
                    
                    const response = await fetch(`https://api.p2pquake.net/v2/history?codes=551&limit=100&offset=${offset}`);
                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();
                    allData = allData.concat(data);
                    
                    if (data.length < 100) break;
                }

                // 「各地の震度に関する情報 (DetailScale)」 かつ 震度情報(points)が存在し、最大震度3(30)以上のもののみ抽出 (46も対象に含む)
                currentEarthquakes = allData.filter(eq => 
                    eq.issue && 
                    eq.issue.type === 'DetailScale' && 
                    eq.points && 
                    eq.points.length > 0 &&
                    eq.earthquake &&
                    (eq.earthquake.maxScale >= 30 || eq.earthquake.maxScale === 46)
                );

                renderList();

            } catch (error) {
                console.error("Error fetching data:", error);
                listContainer.innerHTML = `
                    <div class="p-8 text-center text-red-500">
                        <i class="fa-solid fa-circle-exclamation text-2xl mb-2"></i><br>
                        データの取得に失敗しました。<br>
                        時間をおいて再試行してください。
                    </div>
                `;
            }
        }

        function renderList() {
            const listContainer = document.getElementById('earthquake-list');
            listContainer.innerHTML = '';

            if (currentEarthquakes.length === 0) {
                listContainer.innerHTML = `
                    <div class="p-8 text-center text-gray-500 text-sm">
                        対象の地震情報が見つかりませんでした。
                    </div>
                `;
                return;
            }

            currentEarthquakes.forEach((eq, index) => {
                const maxScaleObj = scaleMap[eq.earthquake.maxScale] || { label: '不明', class: 'bg-gray-400' };
                const timeParts = eq.earthquake.time.split(' '); // [YYYY/MM/DD, HH:mm:ss]
                const dateText = timeParts[0];
                const timeText = timeParts[1].substring(0, 5); // HH:mm
                const name = eq.earthquake.hypocenter.name || '不明';

                const item = document.createElement('div');
                item.className = 'p-4 border-b border-gray-100 cursor-pointer hover:bg-gray-50 transition-colors flex items-center gap-3 list-item-elem';
                item.onclick = () => selectEarthquake(index, item);
                
                item.innerHTML = `
                    <div class="shindo-badge ${maxScaleObj.class} shadow-sm">
                        ${maxScaleObj.label}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-xs text-gray-500 mb-1">${dateText} ${timeText} 発生</div>
                        <div class="font-bold text-gray-800 truncate">${name}</div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-300 text-sm"></i>
                `;
                
                listContainer.appendChild(item);
            });
            
            // Auto select the first item
            if (currentEarthquakes.length > 0) {
                const firstItem = listContainer.querySelector('.list-item-elem');
                selectEarthquake(0, firstItem);
            }
        }

        function selectEarthquake(index, element) {
            currentSelectedEqIndex = index;
            // Highlight list item
            if (element) {
                document.querySelectorAll('.list-item-elem').forEach(el => {
                    el.classList.remove('list-item-active');
                });
                element.classList.add('list-item-active');
            }

            updateText();
        }

        // 震度テキスト変換ヘルパー関数
        function getScaleLabel(scale) {
            if (scale == 46) return '5弱以上と推定（未入電）';
            return scaleMap[scale] ? scaleMap[scale].label : String(scale);
        }

        function updateText() {
            if (currentSelectedEqIndex === -1) return;
            const eq = currentEarthquakes[currentSelectedEqIndex];
            const text = generateText(eq);
            
            document.getElementById('output-text').value = text;
            document.getElementById('copy-btn').disabled = false;
        }

        function generateText(eq) {
            const format = document.getElementById('format-select').value;
            const useRawPoints = document.getElementById('raw-points-check').checked;
            
            // 1. 日時のフォーマット (YYYY/MM/DD HH:mm:ss -> YYYY年MM月DD日 HH:mm)
            const dateObj = new Date(eq.earthquake.time);
            const yyyy = dateObj.getFullYear();
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            const dd = String(dateObj.getDate()).padStart(2, '0');
            const hh = String(dateObj.getHours()).padStart(2, '0');
            const min = String(dateObj.getMinutes()).padStart(2, '0');
            
            const maxScaleStr = getScaleLabel(eq.earthquake.maxScale);
            const tsunamiText = tsunamiMap[eq.earthquake.domesticTsunami] || tsunamiMap["Unknown"];
            
            // 簡易フォーマット用津波テキスト
            let tsunamiShort = "心配なし";
            if (eq.earthquake.domesticTsunami === "Warning") tsunamiShort = "警報等発表中";
            else if (eq.earthquake.domesticTsunami === "NonDestructive") tsunamiShort = "海面変動あり(被害なし)";
            else if (eq.earthquake.domesticTsunami === "Checking" || eq.earthquake.domesticTsunami === "Unknown") tsunamiShort = "調査中/不明";
            
            const hypo = eq.earthquake.hypocenter;
            const hypoName = hypo.name || '不明';
            const magnitude = hypo.magnitude !== -1 ? hypo.magnitude.toFixed(1) : '不明';
            
            let depth = '不明';
            if (hypo.depth === 0) depth = 'ごく浅い';
            else if (hypo.depth > 0) depth = `${hypo.depth}km`;

            let lat = hypo.latitude !== -200 ? `北緯${hypo.latitude}度` : '不明';
            let lon = hypo.longitude !== -200 ? `東経${hypo.longitude}度` : '不明';

            // 2. 震度情報の集計（震度3:30 以上および未入電:46 を抽出）
            const targetPoints = eq.points.filter(p => p.scale >= 30 || p.scale === 46);
            
            // 市区町村以降を切り捨てるための関数（チェックがオンならスルーして観測点を返す）
            function formatCityName(addr) {
                if (useRawPoints) return addr; // チェックONならそのまま（詳細地点）
                
                const exceptions = [
                    "四日市市", "廿日市市", "野々市市", "八日市場市", 
                    "十日町市", "大町市", "町田市",
                    "東村山市", "武蔵村山市", "羽村市", "大村市", "田村市", "村上市", "村山市", "中村市", 
                    "村田町", "大町町", "市川三郷町", "市川町", "上市町", "市貝町", "下市町"
                ];
                for (const ex of exceptions) {
                    if (addr.startsWith(ex)) return ex;
                }
                const gunMatch = addr.match(/^(.+?郡.+?[町村])/);
                if (gunMatch) return gunMatch[1];
                const match = addr.match(/^(.+?[市区町村])/);
                if (match) return match[1];
                return addr;
            }

            const groupedByScale = {};
            targetPoints.forEach(p => {
                if (!groupedByScale[p.scale]) groupedByScale[p.scale] = {};
                if (!groupedByScale[p.scale][p.pref]) groupedByScale[p.scale][p.pref] = new Set();
                const formattedAddr = formatCityName(p.addr);
                groupedByScale[p.scale][p.pref].add(formattedAddr);
            });
            const sortedScales = Object.keys(groupedByScale).sort((a, b) => b - a);

            let resultText = "";

            // =============== フォーマット分岐 ===============
            
            // --- 標準・SNS ---
            if (format === 'standard') {
                resultText = `【地震情報】\n`;
                resultText += `${yyyy}年${mm}月${dd}日 ${hh}:${min}ごろ、最大震度${maxScaleStr}の地震がありました。\n`;
                resultText += `${tsunamiText}\n\n`;
                resultText += `震源地: ${hypoName}\n`;
                resultText += `マグニチュード: ${magnitude}\n`;
                resultText += `深さ: ${depth}\n`;
                
                if (targetPoints.length === 0) {
                    resultText += `\n(震度3以上の観測データはありません)\n`;
                } else {
                    resultText += `\n■ 各地の震度（震度3以上）\n`;
                    sortedScales.forEach(scale => {
                        const scaleStr = getScaleLabel(scale);
                        resultText += `［震度${scaleStr}］\n`;
                        const prefsObj = groupedByScale[scale];
                        Object.keys(prefsObj).forEach(pref => {
                            const addrs = Array.from(prefsObj[pref]).join('、');
                            resultText += `${pref}: ${addrs}\n`;
                        });
                        resultText += `\n`;
                    });
                    resultText = resultText.trimEnd() + `\n`;
                }
            }
            else if (format === 'discord') {
                resultText = `# 地震情報\n`;
                resultText += `${yyyy}年${mm}月${dd}日 ${hh}:${min}ごろ、最大震度${maxScaleStr}の地震がありました。\n`;
                resultText += `${tsunamiText}\n`;
                resultText += `震源地: ${hypoName}\n`;
                resultText += `マグニチュード: ${magnitude}\n`;
                resultText += `深さ: ${depth}\n`;
                resultText += `緯度/経度: ${lat}/${lon}\n`;
                
                if (targetPoints.length === 0) {
                    resultText += `\n(震度3以上の観測データはありません)\n`;
                } else {
                    sortedScales.forEach(scale => {
                        const scaleStr = getScaleLabel(scale);
                        resultText += `\n［震度${scaleStr}］\n`;
                        const prefsObj = groupedByScale[scale];
                        Object.keys(prefsObj).forEach(pref => {
                            const addrs = Array.from(prefsObj[pref]).join('　');
                            resultText += `${pref}: ${addrs}\n`;
                        });
                    });
                }
            } 
            else if (format === 'twitter') {
                resultText = `【地震情報】\n`;
                resultText += `${mm}/${dd} ${hh}:${min}ごろ、最大震度${maxScaleStr}の地震がありました。\n`;
                resultText += `震源: ${hypoName} (M${magnitude} / 深さ${depth})\n`;
                
                if (eq.earthquake.domesticTsunami === "None") {
                    resultText += `津波の心配はありません。\n`;
                } else {
                    resultText += `⚠️${tsunamiText}\n`;
                }
                
                const maxScaleVal = eq.earthquake.maxScale;
                if (maxScaleVal >= 30 || maxScaleVal === 46) {
                    const maxPrefs = Array.from(new Set(eq.points.filter(p => p.scale === maxScaleVal).map(p => p.pref)));
                    if (maxPrefs.length > 0) {
                        resultText += `\n■ 最大震度${maxScaleStr}の地域\n${maxPrefs.join('、')}\n`;
                    }
                }
                resultText += `\n#地震 #地震情報\n`;
            }
            else if (format === 'line') {
                resultText = `【地震情報】\n`;
                resultText += `発生: ${yyyy}/${mm}/${dd} ${hh}:${min}頃\n`;
                resultText += `震源: ${hypoName}\n`;
                resultText += `最大震度: ${maxScaleStr}\n`;
                resultText += `${tsunamiText}\n\n`;
                resultText += `#地震 #緊急情報\n`;
            }
            else if (format === 'insta') {
                resultText = `【地震情報】\n`;
                resultText += `${mm}月${dd}日 ${hh}:${min}頃、地震が発生しました。\n\n`;
                resultText += `📍震源: ${hypoName}\n`;
                resultText += `⚠️最大震度: ${maxScaleStr}\n`;
                resultText += `🌊津波: ${tsunamiShort}\n\n`;
                resultText += `詳細は公式情報をご確認ください。\n\n`;
                resultText += `#地震 #防災 #速報\n`;
            }
            else if (format === 'youtube') {
                resultText = `【地震情報】\n`;
                resultText += `発生日時: ${yyyy}年${mm}月${dd}日 ${hh}:${min}頃\n`;
                resultText += `震源地: ${hypoName}\n`;
                resultText += `最大震度: ${maxScaleStr}\n`;
                resultText += `マグニチュード: M${magnitude}\n`;
                resultText += `深さ: ${depth}\n`;
                resultText += `津波の有無: ${tsunamiShort}\n\n`;
                
                if (targetPoints.length > 0) {
                    resultText += `[各地の震度]\n`;
                    sortedScales.forEach(scale => {
                        const scaleStr = getScaleLabel(scale);
                        resultText += `■震度${scaleStr}\n`;
                        const prefsObj = groupedByScale[scale];
                        Object.keys(prefsObj).forEach(pref => {
                            const addrs = Array.from(prefsObj[pref]).join('、');
                            resultText += `${pref}: ${addrs}\n`;
                        });
                        resultText += `\n`;
                    });
                }
                resultText += `#地震 #地震速報 #Earthquake\n`;
            }
            
            // --- ニュース・公式風 ---
            else if (format === 'nhk') {
                resultText = `【地震情報】\n`;
                resultText += `${dd}日${hh}時${min}分ごろ、${hypoName}を震源とする地震がありました。\n`;
                resultText += `この地震による最大震度は${maxScaleStr}です。\n`;
                resultText += `${tsunamiText}\n\n`;
                if (targetPoints.length > 0) {
                    resultText += `各地の震度は以下の通りです。\n\n`;
                    sortedScales.forEach(scale => {
                        const scaleStr = getScaleLabel(scale);
                        resultText += `【震度${scaleStr}】\n`;
                        const prefsObj = groupedByScale[scale];
                        Object.keys(prefsObj).forEach(pref => {
                            const addrs = Array.from(prefsObj[pref]).join('、');
                            resultText += `${pref}：${addrs}\n`;

        async function copyToClipboard() {
            const text = document.getElementById('output-text').value;
            if (!text) return;

            try {
                // 最新のClipboard APIを試す
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    // フォールバック(古いブラウザ等)
                    const textarea = document.getElementById('output-text');
                    textarea.select();
                    document.execCommand('copy');
                    window.getSelection().removeAllRanges();
                }
                showToast();
            } catch (err) {
                console.error('Failed to copy text: ', err);
                alert('コピーに失敗しました。');
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('hide');
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
                toast.classList.add('hide');
            }, 2000);
        }
